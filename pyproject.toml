[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "spectravision"
version = "0.1.0"
description = "Spectrum image CNN and ViT embedding models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "h5py>=3.10",
    "huggingface_hub>=1.0",
    "torch>=2.2",
]

[project.scripts]
spectravision = "spectravision.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["spectravision", "proteomicsML", "src", "configs"]
